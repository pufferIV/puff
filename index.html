<!DOCTYPE html>
<html lang="fr">
<head>
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>eruda.init();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RusseGram RussianAI ✦</title>
    <meta name="theme-color" content="#4285f4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <style>
        :root {
            --gemini-blue: #4285f4;
            --gemini-purple: #9b51e0;
            --gemini-pink: #e91e63;
            --gemini-grad: linear-gradient(135deg, #4285f4 0%, #9b51e0 50%, #d93025 100%);
            --gemini-text-grad: linear-gradient(90deg, #4285f4, #a142f4, #f43f5e);
            --bg-color: #f0f4f9;
            --card-bg: #ffffff;
            --text-main: #1f1f1f;
            --text-sub: #5f6368;
            --radius-lg: 24px;
            --radius-md: 16px;
            --shadow: 0 4px 20px rgba(66, 133, 244, 0.08);
        }

        @keyframes moveGradient {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInTab {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            height: 100vh;
            overflow: hidden; 
        }

        header { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 1000; padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(226, 232, 240, 0.8); }
        .brand { font-size: 1.25rem; font-weight: 800; background: var(--gemini-text-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 6px; }
        .ai-top-btn { background: var(--gemini-grad); background-size: 200% 200%; animation: moveGradient 6s ease infinite; border: none; color: white; border-radius: 50px; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer; box-shadow: 0 2px 10px rgba(66, 133, 244, 0.3); transition: transform 0.2s, opacity 0.2s; white-space: nowrap; flex-shrink: 0; }
        .ai-top-btn:active { transform: scale(0.95); opacity: 0.9; }

        .container-viewport {
            width: 100vw;
            height: calc(100vh - 65px - 70px);
            overflow: hidden;
        }

        .container { 
            display: flex; 
            width: 100%; 
            height: 100%;
            transition: transform 0.35s cubic-bezier(0.25, 1, 0.5, 1); 
            will-change: transform;
        } 

        .view { 
            min-width: 100vw; 
            width: 100vw; 
            height: 100%;
            flex-shrink: 0; 
            padding: 16px 16px 30px 16px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
        }

        .card { background: var(--card-bg); border-radius: var(--radius-lg); padding: 20px; margin-bottom: 16px; box-shadow: var(--shadow); border: 1px solid #e8eaed; }
        .card h2 { font-size: 1.15rem; background: var(--gemini-text-grad); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 14px; display: flex; align-items: center; gap: 10px; }

        .btn { width: 100%; padding: 14px; background: var(--gemini-grad); background-size: 200% 200%; animation: moveGradient 6s ease infinite; color: white; border: none; border-radius: 50px; font-size: 0.95rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 12px rgba(66, 133, 244, 0.25); transition: opacity 0.2s, transform 0.1s; }
        .btn:active { transform: scale(0.98); opacity: 0.9; }

        .hint-btn {
            position: relative;
            background: white;
            border-radius: 50%;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            color: var(--gemini-blue);
            padding: 4px;
            background-image: var(--gemini-grad);
            background-size: 200% 200%;
            animation: moveGradient 4s ease infinite;
            box-shadow: 0 4px 15px rgba(66, 133, 244, 0.25);
            transition: transform 0.2s;
        }
        .hint-btn:active { transform: scale(0.92); }
        .hint-btn-inner {
            width: 100%;
            height: 100%;
            background: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.3s ease;
        }

        .recording-active .hint-btn-inner {
            background: #ff4d4d !important;
            color: white !important;
        }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #e2e8f0; z-index: 1000; }
        .nav-btn { background: none; border: none; color: var(--text-sub); font-size: 0.72rem; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 20%; }
        .nav-btn.active { color: var(--gemini-blue); font-weight: 700; }
        .nav-btn svg { width: 22px; height: 22px; stroke: currentColor; }
    </style>
</head>
<body id="main-body">

    <header>
        <div class="brand"><span>✦ RusseGram</span></div>
        <button class="ai-top-btn" onclick="switchTab('russian-ai-voice')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
            RussianAI Voice ✦
        </button>
    </header>

    <div class="container-viewport">
        <div class="container" id="swipe-container">

            <div id="view-russian-ai-voice" class="view">
                <div class="card" style="height: 100%; display: flex; flex-direction: column; justify-content: space-between;">
                    <div>
                        <h2><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg> RussianAI Conversation ✦</h2>
                        <p style="font-size:0.85rem; color:var(--text-sub);">Appuie sur le micro pour parler en russe. L'application transcrira votre voix.</p>
                    </div>

                    <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 20px;">
                        <div id="voice-status" style="font-weight: 700; color: var(--gemini-purple); font-size: 1.05rem; min-height: 30px;">Appuie sur le micro pour commencer...</div>
                        
                        <div id="voice-display-container" style="font-size: 1.3rem; font-weight: 800; min-height: 80px; display: flex; align-items: center; justify-content: center; padding: 10px; color: var(--gemini-blue);">
                            <span>Привет! Давай поговорим по-русски.</span>
                        </div>

                        <button id="mic-btn" class="hint-btn" onclick="toggleVoiceRecording()">
                            <div class="hint-btn-inner" id="mic-inner-icon">
                                <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v1a7 7 0 0 1-14 0v-1"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                            </div>
                        </button>
                    </div>

                    <div style="font-size: 0.75rem; color: var(--text-sub); text-align: center;">
                        Mode vocal RusseGram ✦
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // --- SCRIPT RECONNAISSANCE VOCALE DU MICRO ---
        let recognition = null;
        let isRecording = false;

        function toggleVoiceRecording() {
            const statusEl = document.getElementById('voice-status');
            const displayEl = document.getElementById('voice-display-container');
            const micBtn = document.getElementById('mic-btn');

            // 1. Vérifier si la reconnaissance vocale est supportée par le navigateur
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

            if (!SpeechRecognition) {
                alert("❌ Votre navigateur mobile ne supporte pas l'API Vocal. Utilisez Google Chrome sur Android.");
                statusEl.innerText = "Navigateur non compatible.";
                return;
            }

            // 2. Vérification HTTPS (exigence Android/iOS pour le micro)
            if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
                alert("⚠️ Le micro nécessite impérativement un lien sécurisé HTTPS (ex: via GitHub Pages).");
            }

            // 3. Arrêter si déjà en cours
            if (isRecording) {
                if (recognition) recognition.stop();
                return;
            }

            // 4. Initialiser et lancer le micro
            try {
                recognition = new SpeechRecognition();
                recognition.lang = 'ru-RU'; // Langue : Russe
                recognition.continuous = false;
                recognition.interimResults = true;

                recognition.onstart = function() {
                    isRecording = true;
                    statusEl.innerText = "🎙️ Écoute en cours... Parlez en russe !";
                    micBtn.classList.add('recording-active');
                    console.log("Micro activé avec succès !");
                };

                recognition.onresult = function(event) {
                    let transcript = '';
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        transcript += event.results[i][0].transcript;
                    }
                    displayEl.innerHTML = `<span style="color: var(--gemini-purple);">${transcript}</span>`;
                };

                recognition.onerror = function(event) {
                    console.error("Erreur Micro :", event.error);
                    isRecording = false;
                    micBtn.classList.remove('recording-active');

                    if (event.error === 'not-allowed') {
                        alert("🚨 PERMISSION MICRO REFUSÉE ! Allez dans Paramètres Chrome > Paramètres des sites > Microphone et autorisez la page.");
                        statusEl.innerText = "❌ Permis micro refusé.";
                    } else if (event.error === 'no-speech') {
                        statusEl.innerText = "Aucun son détecté. Réessayez !";
                    } else {
                        statusEl.innerText = "Erreur micro : " + event.error;
                    }
                };

                recognition.onend = function() {
                    isRecording = false;
                    micBtn.classList.remove('recording-active');
                    statusEl.innerText = "Appuie sur le micro pour parler...";
                };

                recognition.start();

            } catch (err) {
                console.error("Erreur globale :", err);
                alert("Erreur lors de l'activation du micro : " + err.message);
            }
        }

        function switchTab(tab) {
            console.log("Onglet sélectionné :", tab);
        }
    </script>
</body>
</html>
